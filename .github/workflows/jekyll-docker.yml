name: Flask CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py && echo "app.py OK"

      - name: Verify templates exist
        run: |
          test -f templates/login.html && echo "login.html OK"
          test -f templates/planner.html && echo "planner.html OK"
